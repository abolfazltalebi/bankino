        </a>

        <!-- Mobile Toggle -->
        <button

          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#mobileNavbar"
          aria-controls="mobileNavbar"
          aria-label="باز کردن منو"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Desktop Navigation -->
        <div class="collapse navbar-collapse" id="desktopNavbar">

          </ul>

          <div class="d-flex">
            <button class="btn bg-black text-white px-5 py-2 rounded-pill">
              ورود
            </button>
          </div>
        </div>
      </div>

      <div
        class="offcanvas offcanvas-end d-md-none"
        tabindex="-1"
        id="mobileNavbar"
        aria-labelledby="mobileNavbarLabel"
      >
        <!-- Offcanvas Header -->
        <div class="offcanvas-header">
          <a class="navbar-brand m-0 fw-bold" href="#" id="mobileNavbarLabel">
            <img src="./assets/images/bankino-middleeastbank.svg" alt=""
          /></a>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"

        <div class="offcanvas-body">
          <ul class="navbar-nav mb-4">
            <li class="nav-item">

          </button>
